name: Validate and package

on:
  pull_request:
  push:
    branches: [main, release]
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code
        run: |
          yarn global add @anthropic-ai/claude-code
          echo "$(yarn global bin)" >> "$GITHUB_PATH"

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/inlead --strict

      # Also fails when the manifests carry different versions.
      - name: Build packages
        run: python3 scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: inlead-plugin-packages
          path: dist/*.zip

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
